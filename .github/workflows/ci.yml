name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            python3 -m pytest tests/ -v
          else
            echo "No tests/ directory present; skipping pytest."
          fi

      - name: Check markdown links
        run: |
          if [ -f tools/markdown_link_checker.py ]; then
            python3 tools/markdown_link_checker.py . || true
          else
            echo "markdown_link_checker.py not found; skipping."
          fi

      - name: Validate issue files
        run: |
          if [ -f tools/validate_issue_file.py ] && [ -d issues ]; then
            python3 tools/validate_issue_file.py issues/ || true
          else
            echo "validate_issue_file.py or issues/ not found; skipping."
          fi

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all YAML files
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          errors = 0
          for path in Path('.').rglob('*.y*ml'):
              parts = path.parts
              if '.git' in parts:
                  continue
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      list(yaml.safe_load_all(fh))
              except yaml.YAMLError as exc:
                  print(f"INVALID: {path}: {exc}")
                  errors += 1
          if errors:
              print(f"Found {errors} invalid YAML file(s).")
              sys.exit(1)
          print("All YAML files parsed successfully.")
          PY
